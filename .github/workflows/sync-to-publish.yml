name: Sync content to Obsidian-Publish

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (adjust or remove as needed)

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for pushing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.PUBLISH_SSH_KEY }}

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone Obsidian-Publish repository
        env:
          PUBLISH_REPO: git@github.com:BcKmini/Obsidian-Publish.git
        run: |
          git clone --depth 1 "$PUBLISH_REPO" _publish

      - name: Sync content into Obsidian-Publish/content
        run: |
          mkdir -p _publish/content
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.DS_Store' \
            content/ _publish/content/

      - name: Commit and push to Obsidian-Publish v4 (if any)
        working-directory: _publish
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content
            git commit -m "chore(sync): mirror content from Quartz repo"
            git push origin HEAD:v4
          else
            echo "No changes to commit for Obsidian-Publish"
          fi

