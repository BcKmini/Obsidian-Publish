name: Sync content from Obsidian-Blog into Quartz

on:
  # Manual trigger
  workflow_dispatch: {}
  # Optional: periodic sync (every 15 minutes)
  schedule:
    - cron: "*/15 * * * *"
  # Optional: allow triggering from another repo via repository_dispatch
  repository_dispatch:
    types: [obsidian-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for cloning Obsidian-Blog
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.OBSIDIAN_SSH_KEY }}

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      - name: Clone Obsidian-Blog repository
        env:
          OBSIDIAN_REPO: git@github.com:BcKmini/Obisidan-Blog.git
        run: |
          git clone --depth 1 "$OBSIDIAN_REPO" _obsidian

      - name: Sync files into content/
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.obsidian' \
            --exclude '.DS_Store' \
            _obsidian/ content/

      - name: Commit and push changes (if any)
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content
            git commit -m "chore(sync): update content from Obsidian-Blog"
            git push
          else
            echo "No changes to commit"
          fi

